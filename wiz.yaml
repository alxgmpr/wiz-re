esphome:
  name: puresmart-trucolor

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:

ota:
  platform: esphome

bp5758d:
  data_pin: GPIO1
  clock_pin: GPIO0

output:
  - platform: bp5758d
    id: bp_blue
    channel: 1
    current: 10
  - platform: bp5758d
    id: bp_green
    channel: 2
    current: 10
  - platform: bp5758d
    id: bp_red
    channel: 3
    current: 10
  - platform: bp5758d
    id: bp_ww
    channel: 4
    current: 10
  - platform: bp5758d
    id: bp_cw
    channel: 5
    current: 10

light:
  - platform: rgbww
    name: "TruColor Bulb"
    red: bp_red
    green: bp_green
    blue: bp_blue
    cold_white: bp_cw
    warm_white: bp_ww
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 1500 K
    color_interlock: false
